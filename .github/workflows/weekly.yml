name: weekly-law-update

on:
  schedule:
    - cron: "0 22 * * 0"   # UTC 週日 22:00 = 台灣時間週一 06:00
  workflow_dispatch:        # 可在 Actions 分頁手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: 檢查法規更新、建立索引
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run python -m workrules update
      - name: 提交更新後的資料庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/workrules.db
          git diff --cached --quiet || git commit -m "🗃️ data: 法規更新 $(date -u +%F)"
          git push
